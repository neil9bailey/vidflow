name: Feature request
description: An idea that would make reviewing or culling clips faster.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        VidFlow Player aims to be the fastest way to get through a folder of clips. Ideas that save
        keystrokes or decisions in that loop are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task and where VidFlow slows you down today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working, including keys or menus if you have an idea.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it elsewhere?
      description: Another app that does this well, if any.
