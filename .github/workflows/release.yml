name: Release

# Pushing a tag like v1.0.0 or v1.0.0-beta.4 builds that exact commit and creates a DRAFT
# release with the exe, the zip, the engine's corresponding source and SHA256SUMS.txt.
# Nothing is public until a maintainer reviews the draft on GitHub and presses Publish.
# The tag must match the VERSION file, and CHANGELOG.md needs a dated section for it.
# The exe and zip get a GitHub build-provenance attestation (gh attestation verify). When the
# Partner Center identity is saved as repository variables (docs/STORE.md), the Microsoft Store
# package is built too, as a workflow artifact to upload to Partner Center.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write      # signs the provenance attestation (Sigstore, keyless)
      attestations: write  # stores it on GitHub
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$env:TAG' is not like v1.2.0 or v1.2.0-beta.4" }
          $file = (Get-Content VERSION -TotalCount 1).Trim()
          if ($file -ne $v) { throw "Tag $env:TAG does not match the VERSION file ($file)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Cache engine archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: third_party/download
          key: engine-${{ hashFiles('tools/fetch-engine.ps1') }}

      - name: Fetch engine (pinned, SHA-256 checked)
        run: ./tools/fetch-engine.ps1

      - name: Build
        env:
          VIDFLOW_VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Version $env:VIDFLOW_VERSION

      - name: Core tests
        run: ./tools/run-core-tests.ps1

      - name: Package
        env:
          VIDFLOW_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/package-release.ps1 -Version $env:VIDFLOW_VERSION -OutDir obj/release-assets -Release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            obj/release-assets/VidFlow.exe
            obj/release-assets/VidFlow-*-win-x64.zip

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binaries
          path: |
            obj/release-assets/
            obj/release-notes.md
          if-no-files-found: error

  engine-source:
    # GPL corresponding source for the embedded libmpv-2.dll: the complete source tarball and
    # manifest that the Engine source workflow (engine-source.yml) attached to the engine
    # pre-release for the engine this commit pins. When the engine changes, run that workflow
    # with "publish" before releasing; until then this job fails rather than ship the wrong source.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src

      - name: Download the engine's complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENGINE_TAG=$(sed -n "s/^[$]Tag = '\([^']*\)'.*/\1/p" src/tools/fetch-engine.ps1)
          ENGINE_ARCHIVE=$(sed -n "s/^[$]Archive = '\([^']*\)'.*/\1/p" src/tools/fetch-engine.ps1)
          ENGINE=engine-$ENGINE_TAG
          mkdir engine-source
          cd engine-source
          if ! gh release download "$ENGINE" --repo "$GITHUB_REPOSITORY" -p "$ENGINE-source*"; then
            echo "::error::No complete source on $ENGINE yet: run the Engine source workflow with publish ticked."
            exit 1
          fi
          sha256sum -c -- "$ENGINE-source-SHA256SUMS.txt"
          rm -- "$ENGINE-source-SHA256SUMS.txt"  # the release's own SHA256SUMS.txt covers these files
          # Same text as the Engine source workflow writes when it attaches to a VidFlow release.
          cat > engine-source-README.txt <<EOF
          Corresponding source for libmpv-2.dll, the playback engine inside VidFlow.exe
          ($ENGINE_ARCHIVE from shinchiro/mpv-winbuild-cmake, release $ENGINE_TAG).

          $ENGINE-source.tar.xz is the complete source: the build recipe and every library linked
          into the engine, each at the exact revision the upstream build used, plus the Rust crates it
          links. $ENGINE-source-manifest.tsv lists each item with its version, source location,
          revision and licence.

          The same files are on https://github.com/$GITHUB_REPOSITORY/releases/tag/$ENGINE
          How the revisions were established: docs/ENGINE-SOURCE.md in the VidFlow source.
          EOF
          ls -l

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-source
          path: engine-source/
          if-no-files-found: error

  store-package:
    # Microsoft Store edition: an unsigned MSIX (the Store signs it), kept as a workflow artifact for
    # upload to Partner Center, never attached to the release. Skipped until the repository variables
    # STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME hold the Partner Center
    # identity (docs/STORE.md); STORE_DISPLAY_NAME only if the reserved name isn't "VidFlow Player".
    needs: build
    if: vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache engine archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: third_party/download
          key: engine-${{ hashFiles('tools/fetch-engine.ps1') }}

      - name: Fetch engine (pinned, SHA-256 checked)
        run: ./tools/fetch-engine.ps1

      - name: Package for the Store
        env:
          VIDFLOW_VERSION: ${{ needs.build.outputs.version }}
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME || 'VidFlow Player' }}
        run: |
          ./tools/package-store.ps1 -Version $env:VIDFLOW_VERSION -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME `
            -DisplayName $env:STORE_DISPLAY_NAME

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-msix
          path: obj/store/*.msix
          if-no-files-found: error
          retention-days: 90

  draft:
    needs: [build, engine-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-binaries
          path: dl/bin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: engine-source
          path: dl/src

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir upload
          cp dl/bin/release-assets/* dl/src/* upload/
          cd upload
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" \
            --title "VidFlow Player $VERSION" --notes-file ../dl/bin/release-notes.md -- *
